spring.application.name=resume-ai
server.port=${PORT:8050}

# ── AI / OpenAI ──────────────────────────────────────────────
spring.ai.openai.api-key=${OPENAI_API_KEY:sk-placeholder}
spring.ai.openai.chat.model=${AI_MODEL:gpt-4o-mini}
spring.ai.openai.embedding.model=${EMBEDDING_MODEL:text-embedding-3-small}

# ── RAG / Vector Store ────────────────
app.rag.enabled=true
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration

# ── Database (PostgreSQL) ────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/resumedb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=12345
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── JWT ──────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBITUFDLVNIQTI1NiBoYXNoaW5n}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── Multimodal Python Service ─────────────────────────────────
multimodal.service.url=${MULTIMODAL_SERVICE_URL:http://localhost:8070}

# ── GitHub Token (optional, increases API rate limit) ─────────
github.token=${GITHUB_TOKEN:}

# ── Actuator ─────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

# ── Swagger / OpenAPI ────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
